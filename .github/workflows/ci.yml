# ==============================================================================
# CI/CD PIPELINE - GitHub Actions workflow za automatizaciju
# ==============================================================================
#
# STRUKTURA PIPELINE-a (5 job-ova):
#
# 1. LINT (Lint & Type Check)
#    - Proverava kod sa ESLint-om
#    - Pronalazi sintaksne greške i style probleme
#
# 2. TEST (Unit & Integration Tests)
#    - Pokreće Vitest testove
#    - Zavisi od LINT job-a (needs: lint)
#    - Upload-uje coverage izveštaj kao artifact
#
# 3. BUILD (Build Application)
#    - Builda Next.js aplikaciju
#    - Zavisi od TEST job-a (needs: test)
#    - Upload-uje .next folder kao artifact
#
# 4. DOCKER (Build Docker Image)
#    - Builda Docker image
#    - Pokreće se SAMO na push u main/master
#    - Opciono push-uje na Docker Hub
#
# 5. DEPLOY (Deploy to Vercel)
#    - Deploy-uje na Vercel
#    - Pokreće se SAMO na push u main/master
#
# POTREBNI SECRETS (Settings > Secrets):
# - DATABASE_URL: Connection string za bazu
# - JWT_SECRET: Secret za JWT tokene
# - DOCKERHUB_USERNAME: (opciono) Docker Hub username
# - DOCKERHUB_TOKEN: (opciono) Docker Hub token
#
# ==============================================================================

name: CI/CD Pipeline
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Globalne environment varijable
env:
  NODE_VERSION: "20"

jobs:
  # ==========================================================================
  # JOB 1: Lint i Type Check - Provera kvaliteta koda
  # ==========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalacija dependencija
        run: npm ci

      - name: ESLint provera
        run: npm run lint

  # Job 2: Testovi
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalacija dependencija
        run: npm ci

      - name: Generisanje Prisma klijenta
        run: npx prisma generate

      - name: Pokretanje testova
        run: npm run test:run

      - name: Upload test rezultata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  # Job 3: Build aplikacije
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalacija dependencija
        run: npm ci

      - name: Generisanje Prisma klijenta
        run: npx prisma generate

      - name: Build Next.js aplikacije
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload build artefakata
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  # Job 4: Build Docker image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ednevnik:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
