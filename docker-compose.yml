version: "3.8"

services:
  # APP SERVIS -> Next.js aplikacija
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ednevnik-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL} # Neon.tech PostgreSQL
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/docs",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
